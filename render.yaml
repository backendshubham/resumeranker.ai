services:
  - type: web
    name: your-app-name
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    branches:
      - main
    autoscale:
      minInstances: 1
      maxInstances: 3
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      size: 1GB
